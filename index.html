
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyLauncher 決済結果</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      line-height: 1.8;
      background: #f5f8fc;
      color: #243247;
    }
    main {
      max-width: 560px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">MyLauncher</h1>
    <p id="message">決済結果を確認しています。</p>
    <p>このページを閉じて、MyLauncherに戻ってください。</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const result = params.get("result");
    const title = document.getElementById("title");
    const message = document.getElementById("message");

    if (result === "success") {
      title.textContent = "決済画面から戻りました";
      message.textContent =
        "決済の確認処理中です。MyLauncherに戻って、利用権限を更新してください。";
    } else if (result === "cancel") {
      title.textContent = "決済はキャンセルされました";
      message.textContent =
        "契約手続きは完了していません。必要ならMyLauncherから再度お試しください。";
    } else {
      title.textContent = "MyLauncher";
      message.textContent = "決済結果を確認できませんでした。";
    }
  </script>
</body>
</html>
